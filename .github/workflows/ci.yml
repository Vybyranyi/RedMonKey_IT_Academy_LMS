name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      # Prisma генерує клієнт лише зі схеми — реальне з'єднання з БД не потрібне.
      DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
      DIRECT_URL: 'postgresql://ci:ci@localhost:5432/ci'
    steps:
      - uses: actions/checkout@v4

      # Node 22+: jsdom (через власний undici) використовує
      # webidl.util.markAsUncloneable, якого немає в Node 20 — на ньому
      # падають усі frontend-тести. Node 20 до того ж deprecated на раннерах.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Першим — найшвидший крок. Упав: `npm run format` локально і закомітити.
      - name: Format (Prettier)
        run: npm run format:check

      - name: Build (shared → backend → frontend)
        run: npm run build

      # Після build: правила backend на кшталт no-floating-promises читають
      # типи Prisma Client і shared, які з'являються саме на цьому кроці.
      - name: Lint (shared, backend, frontend)
        run: npm run lint

      # Лише попередження (continue-on-error): вразливість у транзитивній залежності
      # без виправлення не має блокувати PR, але в логах її видно
      - name: Audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      # Тести не ходять у БД: Prisma Client уже згенеровано на кроці build,
      # репозиторії в тестах підмінені моками.
      - name: Test (shared → backend → frontend)
        run: npm test

  # Паралельно з build-and-lint: перевіряє, що Dockerfile збирається, — інакше
  # зламаний Dockerfile виявився б лише на Render після мерджу
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # Кеш шарів між запусками: без змін у залежностях npm ci не повторюється
          cache-from: type=gha
          cache-to: type=gha,mode=max
