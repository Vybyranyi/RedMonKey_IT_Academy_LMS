name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    env:
      # Prisma генерує клієнт лише зі схеми — реальне з'єднання з БД не потрібне.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (frontend)
        run: npm run lint -w frontend

      - name: Build (shared → backend → frontend)
        run: npm run build
