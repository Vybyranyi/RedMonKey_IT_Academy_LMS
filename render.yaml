# Render Blueprint — веб-сервіс LMS як код.
# Dashboard → New → Blueprint → обрати репозиторій: Render прочитає цей файл і створить сервіс.
# База й сховище аватарок — у Supabase (docs/DEPLOY.md), не на Render: free Postgres
# Render видаляється через 30 днів, а постійного диска для файлів на free-плані немає.

services:
  - type: web
    name: redmonkey-lms
    runtime: docker
    plan: free # засинає після 15 хв без запитів, перший запит після сну — ~1 хв
    region: frankfurt # той самий регіон, що й проєкт Supabase (Central EU, Frankfurt)
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render не перемкне трафік на новий деплой, поки тут не буде 200
    healthCheckPath: /api/v1/health
    # Деплой запускає GitHub Actions (.github/workflows/cd.yml) лише після зеленого CI.
    # Простіша альтернатива без Actions: `checksPass` — Render сам чекає на CI
    autoDeployTrigger: 'off'
    envVars:
      # Supabase → Connect → ORMs → Prisma. DATABASE_URL — Transaction pooler (6543,
      # ?pgbouncer=true), DIRECT_URL — Session pooler (5432) для `prisma migrate deploy`
      # на старті контейнера. Не Direct connection: вона лише IPv6, а Render його не має
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Supabase Storage для аватарок. Секретний ключ обходить політики Storage —
      # лише тут, ніколи у VITE_* чи в git
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Випадкові 256 біт (44 символи base64) — генеруються один раз при створенні
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      # Перед контейнером стоїть балансувальник Render — без цього rate-limit
      # бачить одну IP-адресу на всіх користувачів
      - key: TRUST_PROXY
        value: '1'
      # Перший адмін (src/scripts/createAdmin.ts): створюється на старті, лише якщо
      # активного адміна ще немає. sync: false — значення вводиш у Dashboard, не в git
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
