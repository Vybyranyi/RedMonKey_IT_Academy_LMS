# Render Blueprint — уся інфраструктура LMS як код.
# Dashboard → New → Blueprint → обрати репозиторій: Render прочитає цей файл
# і створить базу й веб-сервіс, а змінні оточення зв'яже між собою сам.

databases:
  - name: redmonkey-lms-db
    plan: free # free-база живе 30 днів, потім її треба оновити до платної або створити заново
    region: frankfurt # найближчий до України регіон Render
    postgresMajorVersion: '16'
    databaseName: lms
    user: lms
    # ipAllowList не задано → зовнішні підключення дозволені (потрібні, щоб
    # залити демо-дані сідом з ноутбука). `ipAllowList: []` лишить лише внутрішню мережу Render

services:
  - type: web
    name: redmonkey-lms
    runtime: docker
    plan: free # засинає після 15 хв без запитів, перший запит після сну — ~1 хв
    region: frankfurt # той самий регіон, що й база: трафік іде внутрішньою мережею
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render не перемкне трафік на новий деплой, поки тут не буде 200
    healthCheckPath: /api/v1/health
    # Деплой запускає GitHub Actions (.github/workflows/cd.yml) лише після зеленого CI.
    # Простіша альтернатива без Actions: `checksPass` — Render сам чекає на CI
    autoDeployTrigger: 'off'
    envVars:
      # Internal URL — з'єднання всередині мережі Render, без виходу в інтернет.
      # PgBouncer-а між ними немає, тож для міграцій підходить той самий рядок
      - key: DATABASE_URL
        fromDatabase:
          name: redmonkey-lms-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: redmonkey-lms-db
          property: connectionString
      # Випадкові 256 біт (44 символи base64) — генеруються один раз при створенні
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      # Перед контейнером стоїть балансувальник Render — без цього rate-limit
      # бачить одну IP-адресу на всіх користувачів
      - key: TRUST_PROXY
        value: '1'
